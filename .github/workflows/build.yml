
name: DISTRICT Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if [ ! -f "DISTRICT_Godot_Prototype.zip" ]; then
            echo "ERROR: Project ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p project_src
          unzip -o DISTRICT_Godot_Prototype.zip -d project_src

      - name: Find Godot project
        id: project
        run: |
          PROJECT_FILE=$(find project_src -name project.godot | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found inside ZIP"
            find project_src -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Check Android preset
        run: |
          if [ ! -f "${{ steps.project.outputs.path }}/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg is missing"
            exit 1
          fi

      - name: Prepare build
        run: mkdir -p build

      - name: Import project
        run: |
          godot --headless --editor \
            --path "${{ steps.project.outputs.path }}" --quit

      - name: Export APK
        run: |
          godot --headless \
            --path "${{ steps.project.outputs.path }}" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/DISTRICT.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DISTRICT-Android-APK
          path: build/DISTRICT.apk
          if-no-files-found: error
