name: DISTRICT Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/DISTRICT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DISTRICT-Android-APK
          path: build/DISTRICT.apk
          if-no-files-found: error
